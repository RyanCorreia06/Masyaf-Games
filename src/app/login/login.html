<h2 class="mb-4">★ Login ★</h2>

<div class="row g-4">

  <!-- Já tenho cadastro -->
  <div class="col-12 col-md-6">
    <div class="painel">
      <h3>Já tenho cadastro</h3>

      <form #f="ngForm" (ngSubmit)="entrar()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input id="email" class="form-control" name="email" type="email"
                 [(ngModel)]="Email" required email #campoEmail="ngModel"
                 [class.is-invalid]="campoEmail.invalid && campoEmail.touched">
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input id="senha" class="form-control" name="senha" type="password"
                 [(ngModel)]="password" required minlength="6" #campoSenha="ngModel"
                 [class.is-invalid]="campoSenha.invalid && campoSenha.touched">
          <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
        </div>

        <button class="btn-arcade w-100" [disabled]="f.invalid">Entrar</button>
      </form>

      <div class="mt-3">
        <a routerLink="/esqueci-senha">Esqueci minha senha</a>
      </div>
    </div>
  </div>

  <!-- Ainda não tenho cadastro -->
  <div class="col-12 col-md-6">
    <div class="painel text-center">
      <h3>Ainda não tenho cadastro</h3>
      <a routerLink="/cadastro" class="btn-arcade d-inline-block mt-3">Clique aqui</a>
    </div>
  </div>

</div>
