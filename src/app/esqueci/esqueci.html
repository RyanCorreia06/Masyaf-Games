<div class="esqueci-fundo">
  <div class="painel-recuperar text-center">
    <h3 class="mb-3">Informe o seu e-mail</h3>

    <form #f="ngForm" (ngSubmit)="enviar()" novalidate class="d-flex gap-2 justify-content-center">
      <input class="form-control" type="email" name="email"
             [(ngModel)]="email" required email #campoEmail="ngModel"
             [class.is-invalid]="campoEmail.invalid && campoEmail.touched"
             placeholder="seuemail@exemplo.com">
      <button class="btn-arcade" [disabled]="f.invalid">OK</button>
    </form>

    <div class="invalid-feedback d-block" *ngIf="f.submitted && f.invalid">
      Informe um e-mail válido.
    </div>

    <div class="mt-3">
      <a routerLink="/login">Voltar para o login</a>
    </div>
  </div>
</div>
